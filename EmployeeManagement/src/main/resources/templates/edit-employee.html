<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Edit Employee</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="/employees">

            Employee Management System

        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="card">

        <div class="card-header bg-primary text-white">

            <h3>Edit Employee</h3>

        </div>


        <div class="card-body">

            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>


            <form action="/employees/update"
                  method="post"
                  th:object="${employee}">


                <div class="mb-3">

                    <label>Employee ID</label>

                    <input type="number"
                           class="form-control"
                           th:field="*{employeeId}"
                           readonly>

                </div>


                <div class="mb-3">

                    <label>Name</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{name}"
                           required>

                </div>


                <div class="mb-3">

                    <label>Email</label>

                    <input type="email"
                           class="form-control"
                           th:field="*{email}"
                           required>

                </div>


                <div class="mb-3">

                    <label>Mobile</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{mobile}"
                           pattern="[0-9]{10}"
                           maxlength="10"
                           required>

                </div>


                <div class="mb-3">

                    <label>Department</label>

                    <select class="form-control"
                            th:field="*{department}">

                        <option value="IT">IT</option>

                        <option value="HR">HR</option>

                        <option value="Finance">Finance</option>

                        <option value="Sales">Sales</option>

                        <option value="Marketing">Marketing</option>

                    </select>

                </div>


                <div class="mb-3">

                    <label>Designation</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{designation}"
                           required>

                </div>


                <div class="mb-3">

                    <label>Salary</label>

                    <input type="number"
                           class="form-control"
                           th:field="*{salary}"
                           min="10001"
                           required>

                </div>


                <div class="mb-3">

                    <label>Joining Date</label>

                    <input type="date"
                           class="form-control"
                           th:field="*{joiningDate}"
                           required>

                </div>


                <button type="submit"
                        class="btn btn-primary">

                    Update Employee

                </button>


                <a href="/employees/list"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
