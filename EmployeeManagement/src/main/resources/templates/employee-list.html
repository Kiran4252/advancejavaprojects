<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Employee List</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="/employees">

            Employee Management System

        </a>

        <div>

            <a class="btn btn-light"
               href="/employees">

                Home

            </a>

            <a class="btn btn-success"
               href="/employees/add">

                Add Employee

            </a>

            <a class="btn btn-warning"
               href="/employees/search">

                Search

            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <h2 class="text-center mb-4">

        Employee List

    </h2>


    <div class="table-responsive">

        <table class="table table-bordered table-hover">

            <thead class="table-dark">

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Mobile</th>

                    <th>Department</th>

                    <th>Designation</th>

                    <th>Salary</th>

                    <th>Joining Date</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody>

                <tr th:each="employee : ${employees}">

                    <td th:text="${employee.employeeId}">
                        1
                    </td>

                    <td th:text="${employee.name}">
                        Kiran
                    </td>

                    <td th:text="${employee.email}">
                        email
                    </td>

                    <td th:text="${employee.mobile}">
                        9999999999
                    </td>

                    <td th:text="${employee.department}">
                        IT
                    </td>

                    <td th:text="${employee.designation}">
                        Developer
                    </td>

                    <td th:text="${employee.salary}">
                        50000
                    </td>

                    <td th:text="${employee.joiningDate}">
                        2026-01-01
                    </td>

                    <td>

                        <a th:href="@{/employees/edit/{id}
                            (id=${employee.employeeId})}"
                           class="btn btn-primary btn-sm">

                            Edit

                        </a>


                        <a th:href="@{/employees/delete/{id}
                            (id=${employee.employeeId})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this employee?');">

                            Delete

                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
