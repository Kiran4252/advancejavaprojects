<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Employee Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/employees">
            Employee Management System
        </a>

        <div>

            <a class="btn btn-light"
               href="/employees">
                Home
            </a>

            <a class="btn btn-success"
               href="/employees/add">
                Add Employee
            </a>

            <a class="btn btn-info"
               href="/employees/list">
                Employee List
            </a>

            <a class="btn btn-warning"
               href="/employees/search">
                Search
            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <h1 class="text-center mb-4">
        Employee Management System
    </h1>


    <div class="row">


        <div class="col-md-4">

            <div class="card dashboard-card">

                <div class="card-body text-center">

                    <h5>Total Employees</h5>

                    <h2 th:text="${totalEmployees}">
                        0
                    </h2>

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card dashboard-card">

                <div class="card-body text-center">

                    <h5>Average Salary</h5>

                    <h2>
                        ₹<span
                        th:text="${#numbers.formatDecimal(averageSalary, 0, 2)}">
                        0
                        </span>
                    </h2>

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card dashboard-card">

                <div class="card-body text-center">

                    <h5>High Salary Employees</h5>

                    <a href="/employees/salary"
                       class="btn btn-primary">

                        Salary > ₹50,000

                    </a>

                </div>

            </div>

        </div>

    </div>


    <div class="text-center mt-5">

        <a href="/employees/add"
           class="btn btn-success btn-lg">

            Add New Employee

        </a>

        <a href="/employees/list"
           class="btn btn-primary btn-lg">

            View Employees

        </a>

    </div>

</div>

</body>
</html>
