```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Add Employee</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="/employees">
            Employee Management System
        </a>

        <div>

            <a class="btn btn-light"
               href="/employees">
                Home
            </a>

            <a class="btn btn-info"
               href="/employees/list">
                Employee List
            </a>

            <a class="btn btn-warning"
               href="/employees/search">
                Search
            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <div class="card">

        <div class="card-header bg-success text-white">

            <h3>Add Employee</h3>

        </div>


        <div class="card-body">

            <!-- Error Message -->

            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>


            <!-- Success Message -->

            <div th:if="${success}"
                 class="alert alert-success"
                 th:text="${success}">
            </div>


            <form th:action="@{/employees/save}"
                  th:object="${employee}"
                  method="post">


                <!-- Employee ID -->

                <div class="mb-3">

                    <label class="form-label">
                        Employee ID
                    </label>

                    <input type="number"
                           class="form-control"
                           th:field="*{employeeId}"
                           required>

                </div>


                <!-- Name -->

                <div class="mb-3">

                    <label class="form-label">
                        Name
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{name}"
                           required>

                </div>


                <!-- Email -->

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           class="form-control"
                           th:field="*{email}"
                           required>

                </div>


                <!-- Mobile -->

                <div class="mb-3">

                    <label class="form-label">
                        Mobile
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{mobile}"
                           pattern="[0-9]{10}"
                           maxlength="10"
                           minlength="10"
                           required>

                    <small class="text-muted">
                        Enter exactly 10 digits
                    </small>

                </div>


                <!-- Department -->

                <div class="mb-3">

                    <label class="form-label">
                        Department
                    </label>

                    <select class="form-control"
                            th:field="*{department}"
                            required>

                        <option value="">
                            Select Department
                        </option>

                        <option value="IT">
                            IT
                        </option>

                        <option value="HR">
                            HR
                        </option>

                        <option value="Finance">
                            Finance
                        </option>

                        <option value="Sales">
                            Sales
                        </option>

                        <option value="Marketing">
                            Marketing
                        </option>

                    </select>

                </div>


                <!-- Designation -->

                <div class="mb-3">

                    <label class="form-label">
                        Designation
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{designation}"
                           required>

                </div>


                <!-- Salary -->

                <div class="mb-3">

                    <label class="form-label">
                        Salary
                    </label>

                    <input type="number"
                           class="form-control"
                           th:field="*{salary}"
                           min="10001"
                           required>

                    <small class="text-muted">
                        Salary must be greater than ₹10,000
                    </small>

                </div>


                <!-- Joining Date -->

                <div class="mb-3">

                    <label class="form-label">
                        Joining Date
                    </label>

                    <input type="date"
                           class="form-control"
                           th:field="*{joiningDate}"
                           required>

                </div>


                <!-- Buttons -->

                <button type="submit"
                        class="btn btn-success">

                    Save Employee

                </button>


                <a href="/employees"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
```
